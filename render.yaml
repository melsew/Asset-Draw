services:
  - type: web
    name: asset-draw-demo
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./infrastructure/docker/render-demo.Dockerfile
    dockerContext: .
    preDeployCommand: python -m alembic upgrade head
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: FRONTEND_DIST_DIR
        value: /app/frontend-dist
      - key: DATABASE_URL
        fromDatabase:
          name: asset-draw-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: asset-draw-demo-redis
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: AUTH_ENCRYPTION_KEY
        generateValue: true
      - key: SMS_PROVIDER
        value: console

  - type: keyvalue
    name: asset-draw-demo-redis
    plan: starter
    region: ohio
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: asset-draw-demo-db
    databaseName: asset_draw
    user: asset_draw
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
